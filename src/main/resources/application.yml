spring:
  application:
    name: bai-ai-agent
  profiles:
    active: local
# 临时注释掉，便于开发调试和部署（实际填写 PgVector 数据库信息）
#  datasource:
#    url: xxx
#    username: root
#    password: 123456
  ai:
    # 中转站对话模型配置
#    chat:
#      api-key: ${CHAT_API_KEY}
#      base-url: https://ai.huaibao.top
#      model: gpt-5.4
    chat:
      api-key: ${CHAT_API_KEY}
      base-url: https://api.deepseek.com
      model: deepseek-chat
    # 中转站向量模型配置
    embedding:
      api-key: ${EMBEDDING_API_KEY}
      base-url: https://router.tumuer.me
      model: text-embedding-3-small

    # ollama:
#      base-url: http://localhost:11434
#      chat:
#        model: gemma3:1b
    # MCP 客户端配置（实际需要启动 MCP 服务）
    mcp:
      client:
        stdio:
#          servers-configuration: classpath:mcp-servers.json
        sse:
          connections:
            server1:
              url: http://localhost:8127
# 临时注释掉，便于开发调试和部署（实际需要启动 PgVector 数据库）
#    vectorstore:
#      pgvector:
#        index-type: HNSW
#        dimensions: 1536
#        distance-type: COSINE_DISTANCE
#        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.bailou.aiagent.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  api-key: ${SEARCH_API_KEY}
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai.mcp.client: DEBUG
    org.springframework.ai.chat.client: DEBUG
    com.bailou.aiagent.config.ChatModelConfig: DEBUG